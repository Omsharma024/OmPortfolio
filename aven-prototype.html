function generateRole(){const val=document.getElementById('rolePrompt').value.trim();if(!val){toast('Describe the role you want to create');return}document.getElementById('description').value='We are looking for a Senior Software Engineer to build accessible, scalable product experiences. Collaborate with design and product, own technical decisions, and mentor engineers. Draft based on your brief: '+val;toast('Sample role draft generated — review before publishing')}
function createRole(){const value=document.getElementById('roleTitle').value.trim();if(!value){toast('Please enter a role title');return}state.role=value;state.description=document.getElementById('description').value;save();go(3)}
function publishRole(){state.published=true;save();modal('Your demo role is live',`<p>${esc(state.role)} is available in this prototype’s candidate experience. No external job-board post was sent.</p>`,b('Open candidate experience','mode="candidate";go(1)','full'))}
function roleOptions(){modal('Role actions',`<p>Manage the sample role in this workspace.</p>`,b('Edit role','go(2)','full')+b('View publishing','go(3)','full secondary'))}
function resumeModal(){modal('Resume evidence',`<p><strong>Arjun Mehta · Software Engineer</strong><br>5 years of experience · React, TypeScript, Node.js</p><div class="card"><h3>Razorpay · 2022–Present</h3><p>Led React migration for merchant dashboards. Reduced initial load time by 38%. Built reusable TypeScript components and mentored two engineers.</p></div><p>Source: sample resume, page 1. System design depth is not established by this evidence.</p>`)}
function advance(){state.decision='Advanced to interview';save();toast('Candidate advanced to interview in demo');go(7)}
function decisionModal(){modal('Review the uncertainty',`<p>System design experience is not established in the resume. Request more evidence or schedule a follow-up. Missing information does not automatically mean the candidate is unsuitable.</p>`,b('Schedule follow-up','go(7)','full')+b('Open decision review','go(10)','full secondary'))}
function scheduleModal(){modal('Schedule a conversation',`${field('Date','2026-11-16','date','meetDate')}${field('Time','14:30','time','meetTime')}<div class="field"><label>Format</label><select id="meetFormat"><option>Live team interview</option><option>AI avatar interview</option><option>Phone conversation</option></select></div><p>Timezone: Asia/Kolkata. Calendar and email are simulated.</p>`,b('Save interview','saveInterview()','full'))}
function saveInterview(){const d=document.getElementById('meetDate').value,t=document.getElementById('meetTime').value;if(!d||!t){toast('Choose a date and time');return}state.meeting={date:d,time:t};save();document.querySelector('.modal-wrap').remove();toast('Interview saved for '+d+' at '+t+' IST (demo)')}
function makeDecision(d){if(!document.getElementById('decisionNotes').value.trim()){toast('Add job-related decision notes first');return}if(d==='Offer prepared'&&[...document.querySelectorAll('.decision-check')].some(x=>!x.checked)){toast('Complete the review checklist before preparing an offer');return}state.decision=d;state.decisionNotes=document.getElementById('decisionNotes').value;save();modal(d,`<p>Your decision and notes have been saved in this prototype. No message has been sent to the candidate.</p>`,b(d==='Offer prepared'?'Preview candidate offer':'View audit trail',d==='Offer prepared'?'mode="candidate";go(10)':'go(14)','full'))}
function sendChat(t){if(!t.trim())return;chatMessages.push({user:true,text:t});let reply=mode==='recruiter'?'Based on the sample application, Arjun shows strong React and TypeScript experience. System design depth needs verification. Open his assessment to review the source evidence before deciding.':'Your next step is the 30-minute AI interview. It covers job-related experience, and you can type your answers or request a human interview. The hiring team makes the final decision.';if(/person|human/i.test(t))reply='You can request a human conversation from Interview preparation. In this prototype, the request is recorded locally and is not sent to a recruiter.';if(/shortlist/i.test(t))reply='Your sample shortlist includes Priya (92), Arjun (86), and Neha (78). These are illustrative evidence-alignment scores. Review the underlying evidence before advancing anyone.';chatMessages.push({user:false,text:reply});render();document.querySelector('.content').scrollTop=9999}
function transcriptModal(){modal('Interview transcript',`<p><strong>00:08 · Aven</strong><br>Tell me about a project you’re proud of.</p><p><strong>01:12 · Arjun</strong><br>I led a React migration for a merchant dashboard. We reduced load time by 38% after profiling the critical rendering path.</p><p><strong>02:24 · Aven</strong><br>How did you measure that improvement?</p><p>Sample transcript. No live recording was made.</p>`)}
function saveAnswer(){const answer=document.getElementById('answer').value.trim();if(!answer){toast('Type a response before continuing');return}state.answers=state.answers||[];state.answers.push(answer);save();interviewStep++;render();toast('Response saved in this demo session')}
function checkFile(input){let f=input.files[0];if(!f)return;if(f.size>5*1024*1024||!(/\.(pdf|docx)$/i.test(f.name))){input.value='';toast('Choose a PDF or DOCX under 5 MB');return}document.getElementById('uploadLabel').textContent=f.name+' · Ready to attach (preview only)'}
function submitApplication(){if(!document.getElementById('resumeFile').files.length){toast('Attach your resume before submitting');return}state.application=true;state.profileName=document.getElementById('appName').value;save();go(3)}
function startInterview(){if(!document.getElementById('interviewConsent').checked){toast('Please confirm your consent, or request a human interview');return}interviewStep=0;go(6)}
function alternativeInterview(){modal('Choose another format',`<p>You can request a human interview or an accessibility accommodation without affecting your application.</p><div class="field"><label>Your preference</label><select id="alternative"><option>Human interviewer</option><option>Text-based interview</option><option>Accessibility accommodation</option></select></div>`,b('Save request','state.alternative=document.getElementById("alternative").value;save();document.querySelector(".modal-wrap").remove();toast("Request recorded locally — demo only")','full'))}
function correctionModal(){modal('Request a transcript correction',`<p>Tell the team what was captured incorrectly.</p><div class="field"><textarea id="correction" placeholder="Timestamp and correction…"></textarea></div>`,b('Save request','saveCorrection()','full'))}
function saveCorrection(){const v=document.getElementById('correction').value.trim();if(!v){toast('Please enter a correction');return}state.correction=v;save();document.querySelector('.modal-wrap').remove();toast('Correction request saved locally')}
function withdrawModal(){modal('Manage application',`<p>Withdraw your sample application? This only changes the local prototype.</p>`,b('Withdraw application','state.application=false;save();document.querySelector(".modal-wrap").remove();toast("Demo application withdrawn")','full danger'))}
function dataModal(){modal('Your data & privacy',`<p>This prototype stores basic preferences in this browser. It does not upload resumes or capture microphone or camera data.</p><p>In the proposed product, candidates can request data access, correction, or deletion from the hiring organization.</p>`,b('Clear local prototype data','resetDemo()','full secondary'))}
function resetDemo(){localStorage.removeItem('aven-demo');state={role:'Senior Software Engineer',decision:'Pending review'};chatMessages=[];screen=0;render();toast('Local demo data reset')}
function offerModal(){modal('Sample offer letter',`<p>Dear Arjun,</p><p>We are pleased to offer you the role of Senior Software Engineer at Linear. Annual compensation: ₹34,00,000. Proposed start date: 7 December 2026. Work arrangement: Remote, India.</p><p>This is fictional content for interface review, not an employment agreement.</p>`)}
function acceptOffer(){modal('Accept the sample offer?',`<p>This confirms acceptance only within the prototype. No agreement or notification will be sent.</p>`,b('Confirm demo acceptance','state.offerAccepted=true;save();render();toast("Sample offer accepted")','full'))}
function notificationModal(){modal('You’re up to date',mode==='recruiter'?`<p>6 assessments are ready for review.</p><p>Arjun’s technical interview starts at 14:30 IST.</p>`:`<p>Your interview invitation is ready.</p><p>Complete your AI conversation by 15 November.</p>`,b('View next step',mode==='recruiter'?'go(4)':'go(5)','full'))}
function voiceModal(){modal('Talk with Aven',`<div class="orb-wrap" style="height:160px"><div class="orb" style="width:90px;height:90px"></div></div><p>Voice interface preview. No microphone is accessed. You can ask about your application, interview preparation, or next steps.</p>`,b('Continue in text','go(8)','full'))}
render();
</script></body></html>
