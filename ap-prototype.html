const paths={grid:'M3 3h6v6H3z M15 3h6v6h-6z M3 15h6v6H3z M15 15h6v6h-6z',home:'m3 10 9-7 9 7 M5 9v12h5v-7h4v7h5V9',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',file:'M14 2H5v20h14V7z M14 2v6h5 M8 12h8 M8 16h5',chart:'M4 20V11 M10 20V4 M16 20V8 M22 20H2',shield:'m12 2 8 4v6c0 6-8 10-8 10S4 18 4 12V6z M8 12l3 3 5-6',briefcase:'M3 7h18v14H3z M8 7V3h8v4 M3 12h18 M10 12v3h4v-3',search:'M15.5 15.5 21 21 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',up:'m6 15 6-6 6 6',arrow:'M4 12h16 m-6-6 6 6-6 6',back:'M20 12H4 m6-6-6 6 6 6',plus:'M12 5v14 M5 12h14',send:'m21 3-7 18-4-8-7-4z M10 13 21 3',attach:'m9 12 5-5a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9',bell:'M5 17h14l-2-3V9a5 5 0 0 0-10 0v5z M10 21h4 M12 3V1',help:'M9 8a3 3 0 1 1 5 2c-2 1-2 2-2 3 M12 17h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',settings:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',check:'m5 12 4 4L19 6',clock:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0 M12 6v6l4 2',alert:'m12 3 10 18H2z M12 9v5 M12 17h.01',close:'m6 6 12 12 M6 18 18 6',upload:'M12 16V3 m-5 5 5-5 5 5 M4 15v6h16v-6',download:'M12 3v13 m-5-5 5 5 5-5 M4 17v4h16v-4',lock:'M5 10h14v12H5z M8 10V6a4 4 0 0 1 8 0v4',mail:'M3 5h18v14H3z m0-14 9 8 9-8',users:'M16 21v-3a5 5 0 0 0-10 0v3 M15 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M20 21v-3a6 6 0 0 0-3-5',refresh:'M20 8a9 9 0 1 0 0 8 M20 3v5h-5',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',box:'m3 7 9-5 9 5v11l-9 5-9-5z m0-11 9 5 9-5 M12 12v11',currency:'M5 4h14 M5 8h14 M8 4c8 0 8 9 0 9H5l10 8',link:'m9 15 6-6 M8 17l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0 M16 7l2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0',filter:'M3 5h18 M6 12h12 M10 19h4',doc:'M4 3h16v18H4z M8 7h8 M8 11h8 M8 15h5'};
const icon=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.file}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const suppliers=['Sample Supplier A','Sample Supplier B','Sample Supplier C','Sample Supplier D','Sample Supplier E','Sample Supplier F','Sample Supplier G','Sample Supplier H'];
const reasons=['Receipt mismatch','GSTIN mismatch','TDS section','PO not linked'];
const reasonOwners=['Store team','Finance','Finance','Procurement'];
const invoices=Array.from({length:48},(_,i)=>{const n=i%16;const ri=n%4;const status=n<8?'Needs review':n<12?'Ready for approval':n<14?'Posted':'Due for payment';return{id:'DEMO-'+String(i+1).padStart(4,'0'),supplier:suppliers[n%8],unit:Math.floor(i/16)+1,amount:12000+n*3450+Math.floor(i/16)*1200,age:n%8+1,due:n%4+1,status,reason:status==='Needs review'?reasons[ri]:'All checks passed',owner:status==='Needs review'?reasonOwners[ri]:status==='Ready for approval'?'Approvers':'Finance',originalReason:status==='Needs review'?reasons[ri]:'All checks passed',critical:status==='Needs review'&&n%3===0,po:'PO-DEMO-'+String(i+1).padStart(3,'0'),audit:[],routed:false,reviewed:false};});
let state={page:'Dashboard',unit:'1',role:'AP manager',bucket:'All teams',tab:'Needs review',search:'',severity:'All priorities',owner:'All owners',selected:null,layout:'summary',detail:'Validation',query:'',period:'This week',policies:{receipt:true,tax:true,duplicate:true,approval:true},criticalOnly:false};
let toastTimer;
const navs=[['Dashboard','home'],['AI Manager','spark'],['Workbench','briefcase'],['AI Insights','chart'],['AI Policies','shield']];
function scope(){return invoices.filter(x=>(state.unit==='all'||String(x.unit)===state.unit)&&(state.bucket==='All teams'||x.owner===state.bucket||(state.role==='Approver'&&x.approvedByRole==='Approver')));}
function allUnit(){return invoices.filter(x=>state.unit==='all'||String(x.unit)===state.unit);}
function scopeLabel(){return state.unit==='all'?'All business units':`Business unit ${state.unit}`;}
function badge(s){const c=s==='Rejected'?'grey':s==='Needs review'?'red':s==='Ready for approval'?'purple':s==='Posted'?'green':'amber';return `<span class="pill ${c}">${s}</span>`;}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.className='toast-show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='';el.textContent=''},4000);}
function go(page){state.page=page;state.selected=null;state.criticalOnly=false;render();window.scrollTo(0,0);}
function nav(page){if(page==='Workbench'){state.tab='Needs review';state.search='';state.owner='All owners';state.severity='All priorities'}go(page);}
function logo(){return `<div class="logo" aria-label="AUTO">${icon('spark')}</div>`;}
function shell(){const initials={'Admin':'AD','AP manager':'AP','Approver':'AR','Finance reviewer':'FR','Store team':'ST','Procurement':'PR'}[state.role]||'U';return `<aside class="sidebar"><div class="brand">${logo()}<span class="brand-text">AP Command Center</span><span class="tag">AI</span></div><button class="btn add-btn" data-action="upload" title="Add invoice">${icon('plus')}<span class="nav-label">Add invoice</span></button><div class="side-caption">Workspace</div>${navs.map(([n,i])=>`<button class="nav-button ${state.page===n?'active':''}" data-nav="${n}" title="${n}">${icon(i)}<span class="nav-label">${n}</span>${n==='Workbench'?`<span class="nav-count">${scope().filter(x=>x.status==='Needs review').length}</span>`:''}</button>`).join('')}<div class="side-caption">Your view</div><button class="nav-button" data-action="settings" title="Work bucket: ${state.bucket}">${icon('filter')}<span class="nav-label">${state.bucket==='All teams'?'All work buckets':state.bucket}</span></button><div class="side-bottom"><div class="side-note"><div class="row"><span class="live-dot"></span> Human-in-Command</div>AI checks and recommends.<br>You make the final decision.<button data-nav="Case study">About this design <span style="float:right">↗</span></button></div><div class="side-foot"><button class="side-user" data-action="role" title="Change demo role"><span class="avatar">${initials}</span><span class="nav-label"><b>${state.role}</b><small>Switch role</small></span></button><button class="icon-btn" data-action="help" title="Help" aria-label="Help">${icon('help')}</button></div></div></aside><div class="shell"><header class="topbar"><div class="breadcrumb"><span class="muted">Workspace</span><span>/</span><strong>${esc(state.page==='Answer'?'AI answer':state.page)}</strong></div><div class="topbar-right"><button class="top-search" data-action="search" aria-label="Search invoices">${icon('search')}<span>Search anything...</span><kbd>⌘ K</kbd></button><span class="sample-tag">Illustrative data</span><select class="scope-select" id="unit-select" aria-label="Business unit">${state.role==='Admin'?`<option value="all" ${state.unit==='all'?'selected':''}>All business units</option>`:''}${[1,2,3].map(n=>`<option value="${n}" ${state.unit==n?'selected':''}>Business unit ${n}</option>`).join('')}</select><button class="icon-btn" data-action="notifications" aria-label="Notifications">${icon('bell')}</button></div></header><main class="content" id="main">${pageContent()}</main></div>`;}
function pageContent(){switch(state.page){case'Dashboard':return dashboard();case'Workbench':return workbench();case'Answer':return answer();case'AI Manager':return manager();case'AI Insights':return insights();case'AI Policies':return policies();case'Case study':return caseStudy();default:return dashboard();}}
function render(){const l=document.querySelector('.wb-items'),st=l?l.scrollTop:0;document.getElementById('app').innerHTML=shell();bind();const n=document.querySelector('.wb-items');if(n){n.scrollTop=st;const a=n.querySelector('.wb-item.active');if(a){const top=a.offsetTop-n.offsetTop;if(top<n.scrollTop||top+a.offsetHeight>n.scrollTop+n.clientHeight)n.scrollTop=top-40;}}}
function mascot(){return '<div class="mascot" aria-hidden="true"><div class="head"><div class="face"></div></div><div class="body"></div></div>';}
function composer(small=false){return `<div class="composer"><textarea id="prompt" aria-label="Ask your AP AI Manager" placeholder="${small?'Ask a follow-up...':'Ask about invoices, payments, or anything in between...'}" rows="2"></textarea><div class="composer-tools"><div class="row" style="gap:3px"><button class="icon-btn" data-action="upload" aria-label="Add invoice" title="Add invoice">${icon('plus')}</button><button class="icon-btn" data-action="sources" aria-label="View connected sources" title="Connected sources">${icon('attach')}</button>${small?'':`<span style="font-size:9px;color:#b0b5a7;margin-left:6px">Ask your AP AI Manager</span>`}</div><div class="row" style="gap:0"><span class="mode-label">${icon('spark')} </span><button class="send" data-action="ask" aria-label="Send question">${icon('send')}</button></div></div></div>`;}
function sparkline(color,variant){const lines=['M1 19 12 16 23 18 34 9 45 11 56 5 68 3','M1 19 12 17 23 14 34 13 45 9 56 6 68 5','M1 15 12 17 23 11 34 14 45 8 56 10 68 5','M1 17 12 13 23 15 34 8 45 12 56 6 68 4'];return `<svg class="spark" viewBox="0 0 70 23" style="color:${color}"><path d="${lines[variant]}"/></svg>`;}
function dashboard(){const rows=scope(),reviewRows=rows.filter(x=>x.status==='Needs review'),ready=rows.filter(x=>x.status==='Ready for approval'),due=rows.filter(x=>x.status==='Due for payment'),posted=rows.filter(x=>x.status==='Posted');return `<section class="hero"><div class="eyebrow">YOUR ACCOUNTS PAYABLE, IN FOCUS</div><h1><span>A little less chasing.</span>A lot more moving forward.</h1><p class="hero-sub">Your AI team is on it. Let’s clear what needs you.</p><div class="composer-wrap">${mascot()}<span class="cross one">+</span><span class="cross two">+</span>${composer()}<div class="composer-source">${icon('link')} Working with invoice, purchase order & receipt data <span style="margin-left:auto" class="live-dot"></span></div></div><div class="suggestions"><button class="suggestion" data-query="Which invoices need my attention?">${icon('alert')}<span><b>Clear the blockers</b>Which invoices need me?</span></button><button class="suggestion" data-query="What is due for payment?">${icon('clock')}<span><b>Plan the next payment</b>What’s coming due?</span></button><button class="suggestion" data-query="Why are invoices getting stuck?">${icon('chart')}<span><b>See the bigger picture</b>Why are invoices stuck?</span></button></div></section><section><div class="section-head"><div><h2>Your day, at a glance</h2><p>${scopeLabel()} · ${state.bucket==='All teams'?'All work buckets':state.bucket+' bucket'} · Illustrative data</p></div><span class="period">Current snapshot</span></div><div class="stats">${[['Invoices received',rows.length,'In your current scope','file','#9ea891',0,'All invoices'],['Ready for approval',ready.length,'All checks passed','check','#70a38a',1,'Ready for approval'],['Needs your review',reviewRows.length,reviewRows.filter(x=>x.critical).length+' high priority','alert','#e09c7c',2,'Needs review'],['Due for payment',fmt(due.reduce((s,x)=>s+x.amount,0)),due.length+' invoices · next 4 days','clock','#939da9',3,'Due for payment']].map(([t,n,s,i,c,v,tab])=>`<button class="stat" style="text-align:left" data-tab-link="${tab}"><div class="stat-label">${t}${icon(i)}</div><div class="stat-number">${n}</div><div class="stat-bottom"><span>${s}</span>${sparkline(c,v)}</div></button>`).join('')}</div>${state.role==='Admin'&&state.unit==='all'?unitComparison():''}<div class="dashboard-lower"><div class="panel"><div class="panel-title">Every invoice. A clear next step.<span class="muted">Live snapshot</span></div><div class="flow-stages">${[[reviewRows.length,'#e8b599'],[ready.length,'#c1cba8'],[posted.length,'#88af9c'],[due.length,'#bdc7cf']].map(([n,c])=>`<div class="stage" style="flex:${n||.1};background:${c}"></div>`).join('')}</div>${[['Needs review',reviewRows.length,'#e8b599'],['Ready for approval',ready.length,'#c1cba8'],['Posted',posted.length,'#88af9c'],['Due for payment',due.length,'#bdc7cf']].map(([t,n,c])=>`<div class="legend-row"><span><i class="dot" style="background:${c}"></i>${t}</span><b>${n} invoices</b></div>`).join('')}</div><div class="panel"><div class="panel-title">A closer look at the blockers<button class="subtle-link" data-nav="AI Insights">View insights ↗</button></div>${reasonBars(reviewRows)}<div class="amount-note">Click “Needs your review” to see each exception and its owner.</div></div></div>${reviewRows.length?`<div class="review-strip"><div class="row">${icon('spark')}<div><strong>${reviewRows.length} invoices could use your judgment.</strong><p>AI has checked the details and highlighted the next step for each one.</p></div></div><button class="btn small" data-tab-link="Needs review">Let’s review ${icon('arrow')}</button></div>`:''}</section><div class="footer-note">Illustrative data only · AI recommendations always stay subject to your review.</div>`;}
function unitComparison(){return `<div class="unit-comparison">${[1,2,3].map(u=>{const a=invoices.filter(x=>x.unit===u);return `<button class="unit-card" style="text-align:left" data-unit="${u}"><h3>Business unit ${u} ↗</h3><div class="row between"><span>Received</span><b>${a.length}</b></div><div class="row between"><span>Needs review</span><b>${a.filter(x=>x.status==='Needs review').length}</b></div></button>`}).join('')}</div>`;}
function reasonBars(rows){const max=Math.max(1,...reasons.map(r=>rows.filter(x=>x.reason===r).length));return reasons.map((r,i)=>{const n=rows.filter(x=>x.reason===r).length;return `<div class="reason"><span>${r}</span><div class="bar-bg"><div class="bar-fill" style="width:${n/max*100}%;background:${['#dba98f','#c1c9b3','#abb9a0','#cbd0c2'][i]}"></div></div><b>${n}</b></div>`}).join('');}
function listRows(){return scope().filter(x=>(state.tab==='All invoices'||x.status===state.tab)&&(!state.search||[x.id,x.supplier,x.po,x.reason].some(y=>y.toLowerCase().includes(state.search.toLowerCase())))&&(state.severity==='All priorities'||(state.severity==='High priority'?x.critical:!x.critical))&&(state.owner==='All owners'||x.owner===state.owner));}
const wbTabs=['Needs review','Ready for approval','Posted','Due for payment','Rejected','All invoices'];
const rejectReasons=['Duplicate invoice','Amount or quantity incorrect','Goods or services not received','Supplier details invalid','Other'];
function workbench(){const rows=listRows();if(!rows.some(r=>r.id===state.selected))state.selected=rows[0]?rows[0].id:null;const x=invoices.find(i=>i.id===state.selected);return `<section class="page wb-page"><div class="page-title wb-title"><div><h1>Invoice workbench</h1><p>Pick an invoice on the left. Check the evidence and decide on the right.</p></div><div class="row"><button class="btn" data-action="export">${icon('download')} Export</button><button class="btn primary" data-action="upload">${icon('plus')} Add invoice</button></div></div><div class="tabs">${wbTabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t}<span>${scope().filter(x=>t==='All invoices'||x.status===t).length}</span></button>`).join('')}</div><div class="wb"><div class="wb-list"><div class="wb-list-head"><input class="filter-input" id="list-search" aria-label="Search invoice list" placeholder="Search invoices or suppliers..." value="${esc(state.search)}"><div class="row" style="gap:6px"><select class="filter-select" id="priority" aria-label="Filter priority">${['All priorities','High priority','Standard'].map(p=>`<option ${state.severity===p?'selected':''}>${p}</option>`).join('')}</select><select class="filter-select" id="owner" aria-label="Filter team">${['All owners','Finance','Store team','Procurement','Approvers'].map(p=>`<option ${state.owner===p?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="wb-items" id="invoice-table">${invoiceTable(rows)}</div><div class="wb-list-foot">${rows.length} invoices · Use ↑ ↓ to move</div></div><div class="wb-detail">${x?detailPane(x):'<div class="empty">Nothing to review here. Pick another tab or clear filters.</div>'}</div></div></section>`;}
function invoiceTable(rows){return rows.length?rows.map(x=>`<button class="wb-item ${x.id===state.selected?'active':''}" data-invoice="${x.id}" aria-current="${x.id===state.selected}"><div class="row between"><strong>${x.id}</strong><b>${fmt(x.amount)}</b></div><div class="row between wb-item-sub"><span>${esc(x.supplier)} · Unit ${x.unit}</span><span>${x.age}d</span></div><div class="row" style="gap:6px;margin-top:9px">${x.status==='Needs review'?`<span class="pill ${x.critical?'red':'amber'}">${x.reason}</span>`:badge(x.status)}${x.critical?'<span class="wb-flag">High priority</span>':''}${x.routed&&x.status==='Needs review'?'<span class="wb-flag muted">Routed</span>':''}</div></button>`).join(''):'<div class="empty">No invoices match these filters.<br><button class="btn small" data-action="clear-filters" style="margin-top:17px">Clear filters</button></div>';}
function selectInvoice(id){const x=scope().find(x=>x.id===id);if(!x){toast('This invoice is outside the selected scope.');return}const inList=state.page==='Workbench'&&listRows().some(r=>r.id===id);if(!inList){state.page='Workbench';state.tab=x.status;state.search='';state.owner='All owners';state.severity='All priorities';state.criticalOnly=false;window.scrollTo(0,0)}state.selected=id;state.detail='Validation';render();if(window.innerWidth<900&&inList)document.querySelector('.wb-detail')?.scrollIntoView({behavior:'smooth',block:'start'});}
function moveSel(d){const rows=listRows();if(!rows.length)return;let i=rows.findIndex(r=>r.id===state.selected);i=Math.min(rows.length-1,Math.max(0,i+d));state.selected=rows[i].id;state.detail='Validation';render();document.querySelector('.wb-item.active')?.focus({preventScroll:true});}
function docViewer(x){return `<div class="document-toolbar row between"><span class="row">${icon('file')} Source invoice.pdf</span><span class="row" style="font-size:9px">${icon('lock')} Read-only <button class="icon-btn" data-action="zoom" title="Toggle document zoom" aria-label="Toggle document zoom">${icon('search')}</button></span></div><div class="doc-wrap"><div class="document-page" id="document-page"><div class="row between"><div class="doc-brand">SAMPLE<br>SUPPLIER ${x.supplier.slice(-1)}</div><div><div class="doc-line"></div><div class="doc-line" style="width:56px"></div></div></div><div class="doc-title">INVOICE</div><div class="doc-meta"><div><label>Bill to</label>Sample Business Unit ${x.unit}<br>Address redacted<br>Tax ID: •••• ••••</div><div><label>Invoice number</label>${x.id}<br>Purchase order: ${x.po}<br>Currency: INR</div></div><table><thead><tr><th>Description</th><th>Qty</th><th>Amount</th></tr></thead><tbody><tr><td>Illustrative supplies</td><td>100</td><td>${fmt(Math.round(x.amount/1.18))}</td></tr><tr><td>Tax (illustrative)</td><td>18%</td><td>${fmt(x.amount-Math.round(x.amount/1.18))}</td></tr></tbody><tfoot><tr><td colspan="2">Total amount</td><td>${fmt(x.amount)}</td></tr></tfoot></table><div class="doc-stamp">SAMPLE DOCUMENT</div><div class="doc-watermark">Created for interface demonstration only.<br>Supplier and payment identifiers are intentionally omitted.</div></div></div>`;}
function statusAlert(x){if(x.status==='Needs review')return `<div class="summary-alert"><strong>${x.critical?'High priority · ':''}1 check needs attention</strong><p>${exceptionCopy(x)} ${x.routed?'A correction request has been recorded for '+x.owner+'.':''}</p></div>`;if(x.status==='Rejected')return `<div class="summary-alert" style="background:#f7f7f5;border-color:var(--line)"><strong>Rejected · ${esc(x.rejectReason||'')}</strong><p>This invoice will not be posted. The decision and note are in the audit trail.</p></div>`;return `<div class="summary-alert" style="background:#f2f8ee;border-color:#e1ecd9"><strong>All required checks passed</strong><p>${x.status==='Ready for approval'?'Ready for your decision. AI has not approved it.':x.status==='Posted'?'Approved by a person and posted in the sample workflow.':'Approved and scheduled for payment in the sample workflow.'}</p></div>`;}
function detailPane(x){const blocked=x.status==='Needs review';return `<div class="wb-detail-head"><div><div class="row"><h2>${x.id}</h2>${badge(x.status)}</div><p>${esc(x.supplier)} · ${fmt(x.amount)} · Business unit ${x.unit} · ${blocked&&x.reason==='PO not linked'?'No PO linked':x.po}</p></div><div class="row" style="gap:2px"><button class="icon-btn" data-action="prev" title="Previous invoice (↑)" aria-label="Previous invoice">${icon('up')}</button><button class="icon-btn" data-action="next" title="Next invoice (↓)" aria-label="Next invoice">${icon('down')}</button></div></div><div class="wb-detail-body"><div class="document-viewer wb-doc">${docViewer(x)}</div><div class="wb-checks"><div class="row wb-ai-note">${icon('spark','orange')} AI recommendations · You make the final decision</div>${statusAlert(x)}${blocked?`<div class="row" style="gap:8px;margin-top:10px"><button class="btn small" data-action="route">${icon('users')} ${x.routed?'View correction request':'Route for correction'}</button><button class="btn small" data-action="recheck">${icon('refresh')} Recheck</button></div>`:''}<div class="mini-tabs">${['Validation','Finance','Deductions','Audit'].map(t=>`<button class="mini-tab ${state.detail===t?'active':''}" data-detail="${t}">${t}</button>`).join('')}</div>${details(x)}</div></div>${decisionBar(x)}`;}
function decisionBar(x){const blocked=x.status==='Needs review',ready=x.status==='Ready for approval',canApprove=['AP manager','Approver','Admin'].includes(state.role);if(!blocked&&!ready){const msg={'Posted':'Posted after human approval','Due for payment':'Approved · Scheduled for payment','Rejected':'Rejected · '+esc(x.rejectReason||'')}[x.status];return `<div class="decision-bar done"><span class="row ${x.status==='Rejected'?'muted':'green'}">${icon(x.status==='Rejected'?'close':'check')} ${msg}</span><button class="btn small" data-action="next">Next invoice ${icon('arrow')}</button></div>`;}const hint=blocked?'Approve unlocks once the exception is resolved and rechecked. You can reject at any time.':!canApprove?'Your current role can reject but not approve. <button class="subtle-link" data-action="role">Switch role</button>':'AI has not approved this invoice. Your decision and note go into the audit trail.';return `<div class="decision-bar"><div class="decision-row"><select id="reject-reason" class="filter-select" aria-label="Reject reason"><option value="">Reject reason...</option>${rejectReasons.map(r=>`<option>${r}</option>`).join('')}</select><input id="decision-note" class="filter-input" aria-label="Decision note" placeholder="Note for the audit trail (optional)"><div class="decision-actions"><button class="btn reject" data-action="reject">${icon('close')} Reject</button><button class="btn primary" data-action="approve" ${!ready||!canApprove?'disabled':''} title="${blocked?'Resolve the exception first':!canApprove?'Approver role required':'Approve this invoice'}">${icon('check')} Approve</button></div></div><p class="decision-hint">${hint}</p></div>`;}
function decide(kind){const x=invoices.find(i=>i.id===state.selected);if(!x)return;const reason=document.getElementById('reject-reason')?.value||'',note=(document.getElementById('decision-note')?.value||'').trim();const idx=listRows().findIndex(r=>r.id===x.id);if(kind==='approve'){if(x.status!=='Ready for approval'){toast('Resolve the exception before approving.');return}if(!['AP manager','Approver','Admin'].includes(state.role)){toast('Switch to an approver role to approve.');return}x.audit.push(['Approved by '+state.role,note||'Explicit human approval recorded in prototype.']);x.audit.push(['Posted','Sample posting completed. No payment released.']);x.approvedByRole=state.role;x.status='Posted';x.owner='Finance';}else{if(!reason){toast('Choose a reject reason first.');document.getElementById('reject-reason')?.focus();return}x.audit.push(['Rejected by '+state.role,reason+(note?' · '+note:'')]);x.status='Rejected';x.rejectReason=reason;x.critical=false;x.owner='Finance';}const next=listRows(),at=next.findIndex(r=>r.id===x.id);const pick=at>=0?(next[at+1]||next[at]):(next[idx]||next[idx-1]);state.selected=pick?pick.id:null;state.detail='Validation';render();toast(x.id+(kind==='approve'?' approved and posted.':' rejected.')+(pick&&pick.id!==x.id?' Next invoice is open.':''));}
function exceptionCopy(x){return {'Receipt mismatch':'The invoice quantity is higher than the recorded goods receipt. Ask the store team to verify the missing receipt.','GSTIN mismatch':'The tax identifier on the invoice differs from the supplier master. Finance needs to verify the source records.','TDS section':'The extracted deduction section differs from the configured tax policy. Finance needs to confirm the correct section.','PO not linked':'No purchase order is linked to this invoice. Procurement needs to confirm and link the matching order.'}[x.reason]||'Checks have been completed against the sample records.';}
function validation(x){let vals={'Receipt mismatch':['Receipt quantity','Invoice quantity','Difference','95 units','100 units','5 units'],'GSTIN mismatch':['Supplier master','Invoice says','Difference','•••• 01A','•••• 02B','ID mismatch'],'TDS section':['Policy expects','Invoice says','Difference','Section A','Section B','Needs review'],'PO not linked':['Expected','Invoice says','Difference','Linked PO','Not linked','Missing PO']}[x.reason];return `${x.status==='Needs review'?`<div class="validation-item"><div class="row between"><div class="row">${icon('alert','warn')}<strong>${x.reason}</strong></div><span class="pill amber">${x.owner}</span></div><div class="compare">${vals.slice(0,3).map((v,i)=>`<div class="${i===2?'difference':''}"><span>${v}</span><b>${vals[i+3]}</b></div>`).join('')}</div><div class="next-step"><b>Next step</b> · ${exceptionCopy(x).split('. ')[1]||'Verify the source record, update it, and recheck this invoice.'}</div></div>`:''}<div class="passed-checks">${['Duplicate check','Supplier check','Invoice total',...(x.reason==='Receipt mismatch'||x.reason==='PO not linked'?[]:['PO match']),...(x.reason==='GSTIN mismatch'||x.reason==='TDS section'?[]:['Tax check'])].map(t=>`<span class="pill green">${t} passed</span>`).join('')}</div>`;}
function details(x){switch(state.detail){case'Validation':return validation(x);case'Finance':return `<div class="detail-card">${[['Invoice total',fmt(x.amount)],['Currency','INR'],['Business unit','Business unit '+x.unit],['Purchase order',x.reason==='PO not linked'?'Not linked':x.po],['Owner',x.owner],['Payment terms','Sample · Net 30']].map(([k,v])=>`<div class="row between"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div>`;case'Deductions':return `<div class="detail-card"><h3 style="font-size:14px">${x.reason==='TDS section'?'Deduction review required':'No deduction flags'}</h3><p class="muted" style="margin-top:12px">${x.reason==='TDS section'?'The extracted section does not match the sample policy. Verify the supporting records before making a correction.':'No deduction exception is present in this illustrative invoice. Tax checks use sample policies only.'}</p></div>`;case'Audit':return [['Invoice received','Source document preserved · Sample intake'],['AI checks completed','Purchase order, receipt, tax, and duplicate checks'],[(x.originalReason||x.reason)==='All checks passed'?'Validation completed':'Exception detected',x.originalReason||x.reason],...x.audit].map(([a,b])=>`<div class="audit-item"><span class="audit-dot"></span><div>${esc(a)}<small>${esc(b)}</small></div></div>`).join('');}}
function ask(q){q=(q||document.getElementById('prompt')?.value||'').trim();if(!q){toast('Ask a question about invoices, exceptions, or payments.');return}state.query=q;state.page='Answer';state.selected=null;state.criticalOnly=false;render();window.scrollTo(0,0);}
function answer(){const payment=/payment|due|pay /i.test(state.query),gst=/gst|tax|tds/i.test(state.query),known=/invoice|stuck|attention|payment|due|block|receipt|gst|tax|tds|critical|exception|review|approv/i.test(state.query);let rows=scope().filter(x=>x.status===(payment?'Due for payment':'Needs review'));if(state.criticalOnly)rows=rows.filter(x=>x.critical);if(gst)rows=rows.filter(x=>['GSTIN mismatch','TDS section'].includes(x.reason));const crit=rows.filter(x=>x.critical).length;const old=rows.filter(x=>x.age>7).length;const reasonCounts=reasons.map(r=>[r,rows.filter(x=>x.reason===r).length]).sort((a,b)=>b[1]-a[1]);return `<section class="page"><div class="conversation"><div class="chat-thread"><button class="btn small" data-nav="Dashboard">${icon('back')} Dashboard</button><div class="user-message">${esc(state.query)}</div><div class="ai-message"><div class="ai-mark">${icon('spark')}</div>${!known?'<p>This prototype can show sample invoices, payment schedules, and review exceptions. Here is the current review snapshot.</p>':''}${payment?`<p><strong>${rows.length} invoices totaling ${fmt(rows.reduce((s,x)=>s+x.amount,0))}</strong> are due for payment in the next four days.</p><p>All have passed review in this sample workflow. Check the schedule before releasing a payment.</p>`:`<p><strong>${rows.length} invoices ${state.criticalOnly?'are high priority':'need a person'} in this view.</strong> ${crit} ${crit===1?'is':'are'} high priority${old?', and '+old+' '+(old===1?'is':'are')+' over 7 days old':''}.</p><p>${rows.length?`The most common exception is <strong>${reasonCounts[0][0].toLowerCase()}</strong> (${reasonCounts[0][1]}). Each invoice shows the expected value, the gap, and who can fix it.`:'There are no matching exceptions in your selected scope.'}</p>`}<p style="color:#869c6b;font-size:11px">The breakdown is open on the right →</p></div><div class="followups">${payment?`<button class="btn" data-query="Which invoices need my attention?">Show review exceptions</button>`:`<button class="btn" data-action="only-critical">${state.criticalOnly?'Show all exceptions':'Only high priority'}</button><button class="btn" data-action="reminder">Draft a team reminder</button>`}</div><div class="amount-note" style="margin-top:0">Illustrative data · ${scopeLabel()}<br>AI suggests. It never approves an invoice.</div><div class="chat-foot">${composer(true)}</div></div><div><div class="row between"><div><div class="eyebrow orange" style="margin-bottom:8px">YOUR ANSWER, AT A GLANCE</div><h2 style="font-size:22px">${payment?'Upcoming payments':gst?'Tax exceptions':'Invoices that need you'}</h2></div><button class="btn primary small" data-answer-open="${payment?'Due for payment':'Needs review'}">Open ${rows.length} ${icon('arrow')}</button></div><div class="answer-stat-grid">${payment?[[rows.length,'Invoices due'],[fmt(rows.reduce((s,x)=>s+x.amount,0)),'Total amount'],['4 days','Payment horizon']].map(([v,l])=>`<div class="answer-stat"><b style="${String(v).length>7?'font-size:18px':''}">${v}</b><span>${l}</span></div>`).join(''):[[crit,'High priority'],[rows.length-crit,'Standard'],[old,'Over 7 days old']].map(([v,l])=>`<div class="answer-stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>${payment?`<div class="panel answer-panel"><div class="panel-title">Payment schedule <span class="muted">Illustrative</span></div>${rows.map(x=>`<button class="legend-row" style="width:100%;text-align:left" data-invoice="${x.id}"><span>${x.id} · In ${x.due} days</span><b>${fmt(x.amount)}</b></button>`).join('')}</div>`:`<div class="panel answer-panel"><div class="panel-title">Age of open exceptions <span class="muted">Invoices</span></div><div class="bar-chart">${[1,2,3,4,5,6,7,8].map(age=>{const ar=rows.filter(x=>x.age===age),count=ar.length,critical=ar.filter(x=>x.critical).length;return `<div class="bar-column"><small style="margin:0 0 8px">${count}</small><div class="bar-stack" style="height:${count?Math.max(18,count*32):2}px"><span style="height:${count?critical/count*100:0}%"></span></div><small>${age===8?'8+':age}d</small></div>`}).join('')}</div><div class="row" style="font-size:9px;color:#97a789;margin-top:20px"><span><i class="dot" style="background:#c5ceb7"></i>Standard</span><span><i class="dot" style="background:#ed9c7d"></i>High priority</span></div></div><div class="panel"><div class="panel-title">By reason and owner</div>${reasons.map((r,i)=>`<div class="legend-row"><span>${r}</span><div class="row"><span class="pill grey">${reasonOwners[i]}</span><b>${rows.filter(x=>x.reason===r).length}</b></div></div>`).join('')}</div>`}</div></div></section>`;}
function manager(){const emps=[['Invoice','file','Checks source documents, extracts fields, and flags inconsistencies.'],['Vendor','users','Validates supplier records and flags changes for review.'],['Contracts','doc','Checks invoice terms against the linked agreement.'],['Logistics','box','Compares quantities with goods receipts and delivery records.'],['Tax','currency','Checks configured tax rules and highlights mismatches.'],['Payments','clock','Prepares payment schedules for authorized review.'],['Compliance','shield','Records checks, decisions, and approval evidence.']];return `<section class="page"><div class="page-title"><div><div class="eyebrow" style="margin-bottom:10px">AI EMPLOYEES, WORKING TOGETHER</div><h1>Your AP team, with more capacity.</h1><p>Seven specialized AI Employees. One clear chain of responsibility.</p></div><button class="btn" data-action="flow">${icon('link')} View workflow</button></div><div class="review-strip" style="margin-bottom:24px"><div class="row">${icon('shield')}<div><strong>Human-in-Command, at every approval.</strong><p>Your AI Manager coordinates the work. Authorized people approve invoices.</p></div></div><span class="pill green">Sample team</span></div><div class="team-grid">${emps.map(([n,i,d])=>`<button class="employee-card" style="text-align:left" data-employee="${n}"><div class="employee-icon">${icon(i)}</div><h3>AI ${n} Manager</h3><p>${d}</p><div class="row between"><span><i class="live-dot" style="margin-right:6px"></i> Ready to assist</span><span>View role ↗</span></div></button>`).join('')}</div><div class="footer-note">Illustrative roles and workflows · No live integrations connected.</div></section>`;}
function insights(){const rows=scope().filter(x=>x.status==='Needs review');return `<section class="page"><div class="page-title"><div><div class="eyebrow" style="margin-bottom:10px">FROM PATTERNS TO NEXT STEPS</div><h1>A clearer picture of your AP.</h1><p>Explore what is holding invoices up and where your team can help.</p></div><span class="sample-tag" style="display:block">Illustrative insights</span></div>${state.role==='Admin'?unitComparison():''}<div class="dashboard-lower" style="margin-top:0"><div class="panel"><div class="panel-title">Exception mix <span class="muted">${rows.length} open</span></div>${reasonBars(rows)}</div><div class="panel"><div class="panel-title">Work by team</div>${['Finance','Store team','Procurement'].map(t=>`<div class="legend-row"><span>${t}</span><b>${rows.filter(x=>x.owner===t).length} to review</b></div>`).join('')}<div class="amount-note">Scoped to ${scopeLabel().toLowerCase()}. Admins can compare business units.</div></div></div><div class="panel" style="margin-top:20px"><div class="panel-title">Suggested next steps<span class="pill grey">AI suggestions</span></div>${[['box','Close the receipt gaps','Ask the store team to verify received quantities before finance continues.','Receipt mismatch'],['currency','Review tax mismatches together','Group GSTIN and deduction exceptions to reduce context switching.','GSTIN mismatch'],['clock','Prioritize the oldest invoices','Start with high priority exceptions and invoices over seven days old.','critical']].map(([i,t,d,r])=>`<div class="insight"><div class="employee-icon">${icon(i)}</div><div><h3>${t}</h3><p>${d}</p></div><button class="btn small" data-insight="${r}">Review ${icon('arrow')}</button></div>`).join('')}</div></section>`;}
function policies(){const p=[['receipt','Match invoice to goods receipt','Flag any difference in received quantity for the store team.','Store team'],['tax','Validate supplier tax details','Compare extracted identifiers with the supplier master.','Finance'],['duplicate','Check for duplicate invoices','Flag matching supplier, invoice reference, and amount.','Finance'],['approval','Require human approval','Only an authorized approver can approve an invoice.','Mandatory']];return `<section class="page"><div class="page-title"><div><div class="eyebrow" style="margin-bottom:10px">YOUR RULES. EVERY TIME.</div><h1>AI Policies</h1><p>Make expectations clear before work begins.</p></div><button class="btn primary" data-action="new-policy">${icon('plus')} Draft a policy</button></div><div class="review-strip"><div class="row">${icon('shield')}<div><strong>Human approval is always required.</strong><p>AI can recommend a decision. It cannot approve or pay an invoice.</p></div></div>${icon('lock')}</div><div class="panel" style="margin-top:23px"><div class="panel-title">Invoice review policies <span class="pill grey">Prototype configuration</span></div>${p.map(([id,t,d,o])=>`<div class="policy-item"><div><h3>${t}</h3><p>${d}</p><span class="pill grey" style="margin-top:9px">${o}</span></div><button class="toggle ${state.policies[id]?'on':''}" data-policy="${id}" role="switch" aria-checked="${state.policies[id]}" aria-label="${t}" ${id==='approval'?'disabled':''}></button></div>`).join('')}</div><div class="amount-note">Policy changes are draft settings for this prototype. Existing sample invoice checks remain as recorded.</div><div id="draft-policies"></div></section>`;}
function caseStudy(){return `<article class="case-study"><div class="eyebrow orange">ACCOUNTS PAYABLE COMMAND CENTER · CASE STUDY DRAFT</div><h1>Designing an AI-first command center for invoice review</h1><div class="case-note">Use this text as written for the case study page. Client and product names are left generic until you confirm they can be public. It contains no metrics, because none have been supplied.</div><div class="case-meta"><p><strong>Role:</strong> Product designer and design lead. Research, information architecture, user flows, wireframes, hi-fi design, design system components [confirm scope and team size].</p><p style="margin-bottom:0"><strong>Platform and scope:</strong> Desktop web, enterprise accounts payable.</p></div><h2>Overview</h2><p>An AP team receives a large volume of supplier invoices. Each one has to be checked against purchase orders, goods receipts and tax rules before it can be approved and paid. I redesigned the review experience so that clean invoices move straight to approval and the team spends its time on the ones that need judgment.</p><h2>The problem</h2><ul><li>Reviewers compared invoice fields against system records by hand across several screens.</li><li>When a check failed, it was hard to see which field failed, why, and who needed to act.</li><li>Different roles needed different views, but everyone saw the same screen.</li></ul><h2>Users</h2><ul><li><strong>Finance reviewers:</strong> receive most of the invoices and check tax and other details.</li><li><strong>Store and procurement teams:</strong> receive a small number of invoices that need a receipt or order fix.</li><li><strong>Approvers and managers:</strong> approve invoices, similar to approving a reimbursement.</li><li><strong>Admins:</strong> need a view across all business units.</li></ul><h2>Process</h2><p>I followed a double-diamond process: research and discovery, then definition of flows and structure, then low-fidelity wireframes, then high-fidelity design. Wireframes were desktop only to keep the review focused on the core workflow.</p><ol><li><strong>Understand the business:</strong> map how an invoice moves from receipt to payment, and where it can stop.</li><li><strong>Define the flow:</strong> a full match goes to approval. Any mismatch goes to the team that can fix it, then is rechecked.</li><li><strong>Structure the product:</strong> five navigation areas, shared across the command center products: Dashboard, AI Manager, Workbench, AI Insights, AI Policies.</li><li><strong>Design the screens:</strong> workbench, needs review, posted, dashboards, and the review workspace.</li></ol><h2>Key design decisions</h2><p><strong>1. Document on the left, decisions on the right.</strong> The source document stays read-only on the left. All flags, checks and actions live on the right. Reviewers never wonder whether they changed the evidence.</p><p><strong>2. Exceptions are the main event.</strong> The hardest design problem was showing a failed check and guiding the fix. Each failure shows what was expected, what the invoice says, the gap, and the next step. Passed checks stay quiet.</p><p><strong>3. Role-scoped dashboards.</strong> A user sees only their business unit and work bucket. An admin sees every business and can compare them side by side.</p><p><strong>4. AI visible everywhere.</strong> The dashboard opens with a chat composer so people can ask questions in plain language, with charts and KPIs below. AI suggestions are labeled and never approve anything on their own.</p><p><strong>5. Two review layouts tested.</strong> Version A puts validation, finance, deductions and audit in one short summary. Version B uses four tabs for detail. I recommend A as the default with B as the drill-down [confirm the final choice].</p><h2>Screens to show</h2><div class="table-shell"><table><thead><tr><th>Screen</th><th>What it proves</th><th>Data to use</th></tr></thead><tbody><tr><td>Review workspace (document left, summary right)</td><td>Exception handling and layout thinking</td><td>Illustrative invoice, blurred identifiers</td></tr><tr><td>Dashboard, user and admin</td><td>Role-based design and AI home</td><td>Illustrative figures, labeled</td></tr><tr><td>Needs review list</td><td>Prioritization and filters</td><td>Illustrative rows</td></tr><tr><td>User flow diagram</td><td>Process thinking</td><td>Generic roles and steps</td></tr></tbody></table></div><div class="screen-links"><button class="btn" data-nav="Dashboard">Explore dashboard ${icon('arrow')}</button><button class="btn" data-nav="Workbench">Open workbench ${icon('arrow')}</button><button class="btn" data-action="flow">View user flow ${icon('link')}</button></div><h2>Outcome</h2><p>[Outcome to be added: describe what shipped, what the client said, or what you would measure next. Do not publish numbers you cannot source.]</p><h2>What I learned</h2><ul><li>Design the failure state first, because that is where users spend their time.</li><li>Keep source evidence untouched and put every interpretation beside it.</li><li>Show less by default and let people open detail when they need it.</li></ul><h2>Check before publishing</h2><ul><li>Client and product names approved, or replaced with generic wording</li><li>No real invoice numbers, supplier names, amounts or staff names in any screen</li><li>Every screen with sample data is labeled as illustrative</li><li>No metric, quote or outcome that you cannot source</li><li>Role and scope match what you actually did</li><li>The case study opens with the problem and your role, not the product</li><li>Placeholders in square brackets are filled or removed</li></ul></article>`;}
let lastFocus;
function modal(title,body,actions=''){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row between"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-close aria-label="Close dialog">${icon('close')}</button></div>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;document.body.style.overflow='hidden';document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};document.querySelector('.modal input,.modal select,.modal textarea,.modal button')?.focus();}
function closeModal(){document.getElementById('overlay').innerHTML='';document.body.style.overflow='';lastFocus?.focus();}
function action(name){const x=invoices.find(x=>x.id===state.selected);switch(name){case'ask':ask();break;case'upload':uploadModal();break;case'back-list':state.selected=null;state.page='Workbench';render();break;case'clear-filters':state.search='';state.owner='All owners';state.severity='All priorities';render();break;case'search':searchModal();break;case'help':modal('A little guidance.',`<p>This is an interactive design prototype. Every invoice, amount, supplier, and chart is illustrative.</p><ol class="help-list"><li>Ask the AI Manager about invoices or payments.</li><li>Open the workbench and filter your queue.</li><li>Pick an invoice from the list on the left. Evidence and checks open on the right.</li><li>Approve or reject from the decision bar without leaving the list. Use ↑ ↓ to move between invoices.</li><li>Route an exception, simulate a source correction, then recheck to unlock approval.</li></ol><p>Use ⌘ K / Ctrl K for search. Changes last for this browser session and reset on refresh.</p>`,`<button class="btn primary" data-close>Got it</button>`);break;case'notifications':modal('Your activity',`<p>Sample workspace notifications</p><div class="notification"><h3>${scope().filter(x=>x.status==='Needs review').length} invoices need review</h3><p>Checks are complete. Each exception has an assigned team.</p></div><div class="notification"><h3>${scope().filter(x=>x.status==='Ready for approval').length} ready for approval</h3><p>Awaiting an authorized person’s decision.</p></div>`,`<button class="btn primary" id="notifications-open">Open workbench</button>`);document.getElementById('notifications-open').onclick=()=>{closeModal();nav('Workbench')};break;case'role':roleModal();break;case'scope':modal('Choose your workspace',`<p>Switch the sample business unit. Your selected work bucket is preserved.</p><label for="scope-modal">Business unit</label><select id="scope-modal">${state.role==='Admin'?'<option value="all">All business units</option>':''}${[1,2,3].map(n=>`<option value="${n}" ${state.unit==n?'selected':''}>Business unit ${n}</option>`).join('')}</select>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="scope-save">Apply view</button>`);document.getElementById('scope-save').onclick=()=>{state.unit=document.getElementById('scope-modal').value;state.selected=null;closeModal();render()};break;case'settings':modal('Workspace view',`<p>Preview the experience for different roles and work buckets.</p><label for="bucket-modal">Work bucket</label><select id="bucket-modal">${['All teams','Finance','Store team','Procurement','Approvers'].map(v=>`<option ${state.bucket===v?'selected':''}>${v}</option>`).join('')}</select><p>Changing this selection scopes the dashboard, AI answers, and invoice list. This is a design preview, not an access-control setting.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="bucket-save">Apply view</button>`);document.getElementById('bucket-save').onclick=()=>{state.bucket=document.getElementById('bucket-modal').value;state.selected=null;closeModal();render()};break;case'sources':modal('Your source context',`<p>The AI Manager uses these sample sources to explain checks. No live systems are connected.</p>${[['file','Supplier invoice','Read-only document'],['doc','Purchase order','Sample order record'],['box','Goods receipt','Sample receipt record'],['shield','AI Policies','Configured sample checks']].map(([i,t,d])=>`<div class="notification row">${icon(i)}<div><h3>${t}</h3><p>${d}</p></div><span class="pill grey" style="margin-left:auto">Sample</span></div>`).join('')}`,`<button class="btn primary" data-close>Done</button>`);break;case'zoom':document.getElementById('document-page').classList.toggle('zoomed');break;case'route':routeModal(x);break;case'recheck':recheckModal(x);break;case'approve':decide('approve');break;case'reject':decide('reject');break;case'prev':moveSel(-1);break;case'next':moveSel(1);break;case'only-critical':state.criticalOnly=!state.criticalOnly;render();break;case'reminder':modal('Draft a team reminder',`<p>Preview only. This message will not be sent.</p><label>To</label><input readonly value="Assigned exception owners · ${scopeLabel()}"><label for="reminder">Message</label><textarea id="reminder">Please review the open invoice exceptions assigned to your team. Verify the source records, record any corrections, and return the invoices for recheck. Thank you.</textarea>`,`<button class="btn" data-close>Close</button><button class="btn primary" id="copy-reminder">Copy draft</button>`);document.getElementById('copy-reminder').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('reminder').value);toast('Reminder draft copied. No message was sent.')}catch{document.getElementById('reminder').select();toast('Select and copy the reminder text.')}};break;case'flow':modal('From intake to approval',`<p>Generic roles and steps · Illustrative workflow</p><div class="flow-diagram"><div class="flow-box">Invoice received<small>Source document stored read-only</small></div><div class="flow-arrow">↓</div><div class="flow-box">AI runs validation<small>Invoice · Purchase order · Receipt · Tax policy</small></div><div class="flow-arrow">↓</div><div class="flow-branch"><div class="flow-box">All checks pass<small>Ready for approval</small></div><div class="flow-box" style="background:#fff6ee">A check fails<small>Assigned team verifies & corrects<br>↻ Recheck before continuing</small></div></div><div class="flow-arrow">↓</div><div class="flow-box">Authorized person approves<small>Decision and supporting evidence recorded</small></div><div class="flow-arrow">↓</div><div class="flow-box">Posted → Scheduled for payment<small>Payment release remains a separate controlled action</small></div></div>`,`<button class="btn primary" data-close>Done</button>`);break;case'export':exportCsv();break;case'new-policy':newPolicy();break;}}
function roleModal(){modal('Preview a role',`<p>Explore how the same command center adapts to a person’s work. All data and permissions here are illustrative.</p><label for="role-modal">Role</label><select id="role-modal">${['AP manager','Finance reviewer','Store team','Procurement','Approver','Admin'].map(r=>`<option ${state.role===r?'selected':''}>${r}</option>`).join('')}</select><p>Finance, Store, and Procurement views open their own bucket. Approvers see eligible invoices. Admins can compare all business units.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="role-save">Use this view</button>`);document.getElementById('role-save').onclick=()=>{state.role=document.getElementById('role-modal').value;state.bucket=({'AP manager':'All teams','Finance reviewer':'Finance','Store team':'Store team','Procurement':'Procurement','Approver':'Approvers','Admin':'All teams'})[state.role];if(state.role==='Admin')state.unit='all';else if(state.unit==='all')state.unit='1';state.selected=null;state.page='Dashboard';closeModal();render();toast('Now previewing the '+state.role.toLowerCase()+' view.');};}
function uploadModal(){modal('Add a sample invoice',`<p>Try the intake experience with a local file. The file stays in your browser; this prototype does not extract or upload its contents.</p><div class="dropzone">${icon('upload')}<p>Choose a PDF or image to preview intake.</p><input type="file" id="invoice-file" accept=".pdf,.png,.jpg,.jpeg" aria-label="Choose invoice file"></div><div class="case-note" style="font-size:10px">A new illustrative invoice will be added to your current business unit. Its fields will use sample values.</div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="add-sample">Add sample invoice</button>`);document.getElementById('add-sample').onclick=()=>{const file=document.getElementById('invoice-file').files[0];if(!file){toast('Choose a file to preview invoice intake.');return}const n=invoices.length+1;const owner=state.bucket==='All teams'?'Finance':state.bucket;const inv={id:'DEMO-'+String(n).padStart(4,'0'),supplier:'Sample Supplier '+String.fromCharCode(65+n%8),unit:state.unit==='all'?1:Number(state.unit),amount:24000,age:0,due:4,status:'Needs review',reason:owner==='Store team'?'Receipt mismatch':owner==='Procurement'?'PO not linked':'GSTIN mismatch',owner,critical:false,po:'PO-DEMO-'+n,audit:[['Sample intake created','A local file was selected; no file contents were uploaded.']],routed:false,reviewed:false};invoices.push(inv);state.tab='Needs review';state.search='';state.owner='All owners';state.severity='All priorities';state.page='Workbench';state.selected=inv.id;closeModal();render();toast('Sample invoice added. No file contents were uploaded.');};}
function routeModal(x){if(x.routed){modal('Correction request',`<p>${x.id} is assigned to <strong>${x.owner}</strong>.</p><div class="case-note">${exceptionCopy(x)}</div><p>This prototype recorded the routing event in the invoice audit trail. No external message was sent.</p>`,`<button class="btn primary" data-close>Done</button>`);return}modal('Route for correction',`<p>Keep the invoice evidence untouched. Ask the responsible team to correct the source record.</p><label for="route-owner">Assign to</label><select id="route-owner">${['Finance','Store team','Procurement'].map(o=>`<option ${x.owner===o?'selected':''}>${o}</option>`).join('')}</select><label for="route-note">Correction note</label><textarea id="route-note">${exceptionCopy(x)}</textarea><p>Simulated routing only. No notification will be sent.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="route-save">Record routing</button>`);document.getElementById('route-save').onclick=()=>{x.owner=document.getElementById('route-owner').value;const note=document.getElementById('route-note').value.trim();if(!note){toast('Add a correction note.');return}x.routed=true;x.audit.push(['Routed to '+x.owner,note]);closeModal();render();toast('Correction request recorded in the sample audit trail.');};}
function recheckModal(x){modal('Recheck source records',`<p>The original invoice stays read-only. Rechecking compares it with the latest source records.</p><div class="case-note">Current exception: ${x.reason}<br>${exceptionCopy(x)}</div><label for="correction-state">Sample source record state</label><select id="correction-state"><option value="unchanged">No correction made</option><option value="fixed">Simulate a corrected source record</option></select>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="run-recheck">Run sample recheck</button>`);document.getElementById('run-recheck').onclick=()=>{const fixed=document.getElementById('correction-state').value==='fixed';if(fixed){x.audit.push(['Source correction simulated',x.reason+' resolved in sample source records.']);x.status='Ready for approval';x.reason='All checks passed';x.critical=false;x.owner='Approvers';x.reviewed=true;x.audit.push(['Recheck passed','Moved to approval queue. Not approved by AI.']);state.tab='Ready for approval';}else x.audit.push(['Recheck completed','Source records unchanged; exception remains open.']);closeModal();render();toast(fixed?'Checks passed. Approve or reject it right here.':'Exception remains open. Source records have not changed.');};}
function approveModal(x){if(!['AP manager','Approver','Admin'].includes(state.role)){modal('An approver makes this decision',`<p>This invoice is ready for approval, but the current preview role is <strong>${state.role}</strong>.</p><p>Switch to the Approver view to review and confirm the decision. AI does not approve invoices.</p>`,`<button class="btn" data-close>Keep reviewing</button><button class="btn primary" id="switch-approver">Preview as Approver</button>`);document.getElementById('switch-approver').onclick=()=>{state.role='Approver';state.bucket='Approvers';state.unit=String(x.unit);closeModal();render();toast('Approver view selected. Confirm approval when ready.');};return}modal('Approve this invoice?',`<p>You are confirming approval of <strong>${x.id}</strong> for <strong>${fmt(x.amount)}</strong>.</p><div class="case-note">All required checks passed. This action will record your approval and move the sample invoice to Posted. It does not release a payment.</div><label for="approval-note">Approval note (optional)</label><textarea id="approval-note" placeholder="Add context for the audit trail..."></textarea>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="confirm-approve">Confirm approval</button>`);document.getElementById('confirm-approve').onclick=()=>{if(x.status!=='Ready for approval'){toast('This invoice is no longer eligible for approval.');return}x.audit.push(['Approved by '+state.role,document.getElementById('approval-note').value.trim()||'Explicit human approval recorded in prototype.']);x.audit.push(['Posted','Sample posting completed. No payment released.']);x.approvedByRole=state.role;x.status='Posted';x.owner='Finance';closeModal();render();toast('Sample approval recorded. Invoice moved to Posted.');};}
function searchModal(){modal('Find an invoice',`<p>Search the sample invoices in your current scope.</p><input id="global-search" placeholder="Invoice, supplier, or purchase order..." aria-label="Search all invoices"><div class="search-results" id="search-results"></div>`);const input=document.getElementById('global-search');const update=()=>{let q=input.value.toLowerCase();const rows=scope().filter(x=>[x.id,x.supplier,x.po].some(v=>v.toLowerCase().includes(q))).slice(0,6);document.getElementById('search-results').innerHTML=rows.map(x=>`<button data-result="${x.id}"><span>${x.id}<small style="display:block;margin-top:4px">${x.supplier}</small></span><small>${x.status} →</small></button>`).join('')||'<p>No matching invoices in this scope.</p>';document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{closeModal();state.page='Workbench';selectInvoice(b.dataset.result)})};input.oninput=update;update();input.focus();}
function exportCsv(){const rows=listRows(),csv=[['Illustrative data only'],['Invoice','Supplier','Business unit','Amount INR','Status','Exception','Owner','Age days'],...rows.map(x=>[x.id,x.supplier,x.unit,x.amount,x.status,x.reason,x.owner,x.age])].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ap-illustrative-invoices.csv';a.click();URL.revokeObjectURL(url);toast('Exported '+rows.length+' illustrative invoices.');}
const drafts=[];
function newPolicy(){modal('Draft a policy',`<p>Describe the rule and the team responsible for exceptions. Drafts do not change invoice validation.</p><label for="policy-name">Policy name</label><input id="policy-name" placeholder="e.g. Review invoices without a receipt"><label for="policy-rule">Rule</label><textarea id="policy-rule" placeholder="When an invoice has no receipt, route it to the store team for verification."></textarea>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="save-policy">Save draft</button>`);document.getElementById('save-policy').onclick=()=>{const name=document.getElementById('policy-name').value.trim(),rule=document.getElementById('policy-rule').value.trim();if(!name||!rule){toast('Add a policy name and rule.');return}drafts.push({name,rule});closeModal();render();toast('Policy draft saved for this prototype session.');};}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>ask(b.dataset.query));document.querySelectorAll('[data-tab-link]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tabLink;state.page='Workbench';state.search='';state.owner='All owners';state.severity='All priorities';render();window.scrollTo(0,0)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.search='';render()});bindTable();document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{state.layout=b.dataset.layout;render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.detail;render()});document.querySelectorAll('[data-detail-link]').forEach(b=>b.onclick=()=>{state.layout='details';state.detail=b.dataset.detailLink;render()});document.querySelectorAll('[data-answer-open]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.answerOpen;state.page='Workbench';state.severity=state.criticalOnly?'High priority':'All priorities';state.search=/gst|tax|tds/i.test(state.query)?'mismatch':'';state.owner='All owners';if(/gst|tax|tds/i.test(state.query)){state.search='';state.owner='Finance'}state.criticalOnly=false;render();window.scrollTo(0,0)});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{state.unit=b.dataset.unit;render()});document.querySelectorAll('[data-insight]').forEach(b=>b.onclick=()=>{state.tab='Needs review';state.page='Workbench';state.search=b.dataset.insight==='critical'?'':b.dataset.insight;state.severity=b.dataset.insight==='critical'?'High priority':'All priorities';state.owner='All owners';render()});document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>{state.policies[b.dataset.policy]=!state.policies[b.dataset.policy];render();toast('Draft policy setting updated. Existing checks are unchanged.');});document.querySelectorAll('[data-employee]').forEach(b=>b.onclick=()=>employeeModal(b.dataset.employee));const u=document.getElementById('unit-select');if(u)u.onchange=()=>{state.unit=u.value;state.selected=null;render()};const period=document.getElementById('period');if(period)period.onchange=()=>{state.period=period.value;toast(period.value==='Today'?'Showing the current sample snapshot. Historical data is not connected.':'Showing the sample week snapshot.');};const input=document.getElementById('list-search');if(input)input.oninput=()=>{state.search=input.value;const r=listRows();document.getElementById('invoice-table').innerHTML=invoiceTable(r);const f=document.querySelector('.wb-list-foot');if(f)f.textContent=r.length+' invoices · Use ↑ ↓ to move';bindTable();document.querySelector('#invoice-table [data-action="clear-filters"]')?.addEventListener('click',()=>action('clear-filters'));};for(const [id,key]of[['priority','severity'],['owner','owner']]){const e=document.getElementById(id);if(e)e.onchange=()=>{state[key]=e.value;render();};}const prompt=document.getElementById('prompt');if(prompt)prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};if(state.page==='AI Policies'&&!state.selected&&drafts.length)document.getElementById('draft-policies').innerHTML=`<div class="panel" style="margin-top:20px"><div class="panel-title">Your policy drafts <span class="pill grey">Not active</span></div>${drafts.map(d=>`<div class="policy-item"><div><h3>${esc(d.name)}</h3><p>${esc(d.rule)}</p></div><span class="pill amber">Draft</span></div>`).join('')}</div>`;}
function bindTable(){document.querySelectorAll('[data-invoice]').forEach(b=>{b.onclick=()=>selectInvoice(b.dataset.invoice);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectInvoice(b.dataset.invoice);}}});}
function employeeModal(name){const tasks={Invoice:['Extract invoice fields','Check totals and required fields','Flag duplicate references'],Vendor:['Compare supplier master records','Flag tax identifier changes','Request human verification'],Contracts:['Find the linked agreement','Compare payment terms','Highlight terms requiring judgment'],Logistics:['Compare receipt quantities','Identify missing goods receipts','Route discrepancies to the store team'],Tax:['Check configured tax identifiers','Compare deduction sections','Route tax exceptions to finance'],Payments:['Group approved invoices by due date','Prepare a payment schedule','Present the schedule for human review'],Compliance:['Preserve source evidence','Record policy checks and versions','Maintain the approval audit trail']};modal('AI '+name+' Manager',`<p>A specialized AI Employee working under the AP AI Manager.</p><ul class="check-list">${tasks[name].map(x=>`<li>${x}</li>`).join('')}</ul><div class="case-note" style="margin-top:18px">Authority boundary: checks and recommendations only. Human approval is always required. No live systems are connected.</div>`,`<button class="btn" data-close>Close</button><button class="btn primary" id="employee-work">View related work</button>`);document.getElementById('employee-work').onclick=()=>{state.page='Workbench';state.tab=name==='Payments'?'Due for payment':'Needs review';state.search='';state.severity='All priorities';state.owner=({Logistics:'Store team',Tax:'Finance',Contracts:'Procurement'})[name]||'All owners';closeModal();render()};}
document.addEventListener('keydown',e=>{if(state.page==='Workbench'&&!document.querySelector('.modal')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();moveSel(e.key==='ArrowDown'?1:-1);return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const f=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select')].filter(el=>!el.disabled);const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();

</script></body></html>
